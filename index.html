
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #e6f3ff;
            padding: 40px;
        }

        input, button {
            padding: 12px;
            margin: 10px;
        }

        #result {
            background: white;
            padding: 20px;
            margin: 20px auto;
            border-radius: 10px;
            max-width: 450px;
        }
    </style>
</head>
<body>

    <h1>Weather Information</h1>

    <input type="text" id="city" placeholder="Enter city" value="Chennai">
    <button onclick="getWeather()">Get Weather</button>

    <div id="result">Weather details will appear here.</div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            if (!city) {
                result.textContent = "Please enter a city name.";
                return;
            }

            result.textContent = "Loading weather...";

            const apiKey = "40d1e08023dee4b3a31a2e8430838a01";

            try {
                const url =
                    `https://api.weatherstack.com/current?access_key=${apiKey}&query=${encodeURIComponent(city)}`;

                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    result.textContent = "API Error: " + data.error.info;
                    return;
                }

                result.innerHTML = `
                    <h2>${data.location.name}, ${data.location.country}</h2>
                    <p>Temperature: ${data.current.temperature} °C</p>
                    <p>Weather: ${data.current.weather_descriptions.join(", ")}</p>
                    <p>Humidity: ${data.current.humidity}%</p>
                    <p>Wind Speed: ${data.current.wind_speed} km/h</p>
                `;
            } catch (error) {
                result.textContent =
                    "Request failed. Check your internet connection and browser console.";
                console.error(error);
            }
        }
    </script>

</body>
</html>
